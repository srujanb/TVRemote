name: TVRemote
options:
  bundleIdPrefix: com.sbarai
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
packages:
  ItsytvCore:
    url: https://github.com/nickustinov/itsytv-core.git
    revision: 052d9a9a0416d577119316ea813aa3b822b408e5
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: C9U2X86487
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
targets:
  TVRemote:
    type: application
    platform: iOS
    sources:
      - path: TVRemote
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: TV Remote uses your local network to find and control TVs on your Wi-Fi.
        NSBonjourServices:
          - _androidtvremote2._tcp
          - _companion-link._tcp
          - _mediaremotetv._tcp
          - _airplay._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbarai.TVRemote
        PRODUCT_NAME: TVRemote
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    dependencies:
      - package: ItsytvCore
        product: ItsytvCore
  TVRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TVRemoteTests
    dependencies:
      - target: TVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sbarai.TVRemoteTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
        TVRemoteTests: [test]
    test:
      targets:
        - TVRemoteTests
